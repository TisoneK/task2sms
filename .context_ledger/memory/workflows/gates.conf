# Gate command registry (project-owned; copy/update after bootstrap)
#
# Commands are executed from the project repository root by
# .context_ledger/core/bin/ledger-gates. Keep secrets out of this file.
#
# mode=hybrid: explicit commands below run first; a gate with no explicit
# command falls back to conventional discovery. mode=explicit would fail a
# gate that has no configured command.
#
# Project notes (2026-10-11 — core 2.2.0 onboarding):
# - The reliable, fast, green check is the backend pytest suite (54 tests,
#   ~8s, no network). It needs the backend venv (see tools/gates/pytest.sh).
# - The suite goes through `git -c 'alias.…=!sh tools/gates/pytest.sh' …` on
#   purpose: ONE registry line works on macOS (backend/venv/bin/python) and on
#   Windows (backend/venv/Scripts/python.exe, where a plain PowerShell has no
#   POSIX PATH for a bare `sh`). `git` is present in both shells and a `!`
#   alias runs through git's own shell; the launcher picks the right interpreter.
# - `ruff`/frontend checks are intentionally NOT gates here (kept fast + green).
mode=hybrid

# One command per line: <gate>|<command>
# Gates: checkpoint, pre-commit, integration, exit
pre-commit|git -c 'alias.ledger-gate=!sh tools/gates/pytest.sh' ledger-gate
integration|git -c 'alias.ledger-gate=!sh tools/gates/pytest.sh' ledger-gate
exit|git -c 'alias.ledger-gate=!sh tools/gates/pytest.sh' ledger-gate
