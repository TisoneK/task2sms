# Railway configuration — single-service deploy.
#
# Docs: https://railway.com/docs/config-as-code
#
# Topology: ONE Railway service hosts both the FastAPI backend and the
# built React SPA. The Dockerfile at the repo root builds a multi-stage
# image (frontend build → bake into backend image). uvicorn serves
# /api/* (API) and /* (SPA) from one process on $PORT.
#
# Required Railway variables (set in the Railway dashboard or via `railway
# variables set`):
#   SECRET_KEY       — JWT signing secret (NOT the default placeholder)
#   WEBHOOK_SECRET   — HMAC signing secret (NOT the default placeholder)
#   FRONTEND_URL     — https://<this-service>.up.railway.app (your Railway domain)
#   DATABASE_URL     — postgresql+asyncpg://... (from Railway Postgres plugin)
#                      OR sqlite+aiosqlite:////app/data/task2sms.db (volume mount)
#
# Optional (set per-feature):
#   AT_USERNAME, AT_API_KEY, AT_SENDER_ID          — Africa's Talking
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER  — Twilio
#   TELEGRAM_BOT_TOKEN                              — Telegram
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_EMAIL, SMTP_FROM_NAME
#   WHATSAPP_PROVIDER, WHATSAPP_FROM

[build]
  # Schema enum: NIXPACKS | DOCKERFILE | RAILPACK | HEROKU | PAKETO.
  # Use DOCKERFILE so Railway builds from the root Dockerfile (multi-stage:
  # Node 20 builds frontend → Python 3.11 runtime bakes dist/ into /app/static).
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  # Railway's HTTP healthcheck pings this path; /api/health returns
  # {"status":"ok","version":"1.0.0"} without touching the DB.
  healthcheckPath = "/api/health"
  healthcheckTimeout = 30
  # Restart policy: Railway restarts automatically; this is belt-and-braces.
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
  # Migrations run BEFORE the service starts (Railway runs preDeployCommand
  # in a fresh container using the built image, then starts the main
  # container). `alembic upgrade head` is idempotent — safe on every deploy.
  # The Dockerfile CMD ALSO runs it (belt-and-braces for local `docker run`
  # and other hosts that don't have a preDeploy phase).
  preDeployCommand = "alembic upgrade head"
  # Explicit start command — overrides the Dockerfile CMD. Reads $PORT
  # (Railway injects it) with 8000 as fallback for local `docker run`.
  startCommand = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
  # If using SQLite + a Railway volume (not the Postgres plugin), the
  # volume MUST be mounted at /app/data — Railway will refuse to deploy
  # if the mount is missing. Create the volume in the dashboard
  # (Service → Settings → Volumes → Add Volume, mount path /app/data).
  # If using the Postgres plugin instead, set DATABASE_URL to the plugin
  # URL and remove this line (no volume needed).
  requiredMountPath = "/app/data"
